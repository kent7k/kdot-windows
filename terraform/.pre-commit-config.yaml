# Terraform リポに置く .pre-commit-config.yaml。
#   pre-commit install && pre-commit run -a
# ツールは mise（wsl/mise.toml）で入る: terraform tflint trivy terraform-docs gitleaks
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/.tflint.hcl]
      - id: terraform_trivy
        args: [--args=--severity=HIGH,CRITICAL, --args=--skip-dirs=**/.terraform]
      - id: terraform_docs
        args: [--args=--config=.terraform-docs.yml]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

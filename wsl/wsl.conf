# /etc/wsl.conf — ディストリ単位の設定。変更後は  wsl --shutdown
[boot]
systemd=true

[automount]
enabled=true
# Windows 側のファイルの実行ビット・メタデータを扱う
options="metadata,umask=22,fmask=11"

[interop]
enabled=true
# Windows の PATH を WSL に流し込まない（遅さと衝突の元）。
# 必要な .exe は wsl/shell で個別に PATH へ足す
appendWindowsPath=false

[network]
# dns-vpn.sh を使う場合は false にする（mirrored networking なら true のまま）
generateResolvConf=true
